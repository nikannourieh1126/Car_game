<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFS ProStreet 3D Mobile Driving</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="webgl-canvas"></canvas>

        <!-- NFS ProStreet Racing HUD Overlay -->
        <div id="hud">
            <!-- Top Left: Leaderboard Standings Panel -->
            <div id="leaderboard">
                <div class="lb-title">RACE STANDINGS</div>
                <div class="lb-row">1. CHET HIGGENS</div>
                <div class="lb-row">2. ATSUSHI MURAGUCHI</div>
                <div class="lb-row player">3. RYAN COOPER (YOU)</div>
                <div class="lb-row">4. SHINJI TAKASU</div>
                <div class="lb-row">5. FELIX TANG</div>
            </div>

            <!-- Top Center: Laptime & Lap Counter -->
            <div id="laptime-card">
                <div class="laptime-header">LAPTIME:</div>
                <div class="laptime-val" id="lap-time">00:15.72</div>
                <div class="lap-counter">LAP: <span id="current-lap">2/3</span></div>
            </div>

            <!-- Top Right: Camera & Transmission Buttons & Gamepad Status -->
            <div id="top-right-bar">
                <button id="btn-toggle-trans" class="mode-badge auto">AUTO (PRND)</button>
                <button id="btn-camera-switch" class="btn-action">CHASE 1</button>
                <div class="gamepad-status" id="gamepad-badge">
                    <span class="dot"></span> <span id="gamepad-name">TOUCH / KEYBOARD</span>
                </div>
            </div>

            <!-- Bottom Left: Circuit Minimap -->
            <div id="minimap-container">
                <canvas id="minimap-canvas" width="130" height="130"></canvas>
            </div>

            <!-- Bottom Right: Analog Dial Tachometer / Digital Speedometer -->
            <div id="nfs-dial">
                <svg viewBox="0 0 120 120" class="dial-svg">
                    <circle class="dial-bg" cx="60" cy="60" r="50"></circle>
                    <circle id="rpm-arc" class="dial-val" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                </svg>
                <div class="dial-center">
                    <div id="gear-display" class="dial-gear">D</div>
                    <div id="speed-value" class="dial-speed">0</div>
                    <div class="dial-unit">KM/H</div>
                    <div class="nfs-badges">
                        <span class="status-badge active">ABS</span>
                        <span class="status-badge active">SM</span>
                        <span class="status-badge active">TC</span>
                    </div>
                </div>
            </div>

            <!-- Manual Gear Shift Controls -->
            <div id="manual-controls" class="hidden">
                <button id="btn-shift-up" class="shift-btn">+ GEAR</button>
                <button id="btn-shift-down" class="shift-btn">- GEAR</button>
            </div>

            <!-- Touch Steering & Pedals for Mobile -->
            <div id="touch-controls">
                <div id="touch-steering-container">
                    <div id="touch-wheel"></div>
                </div>

                <div id="touch-pedals">
                    <div id="pedal-brake" class="pedal brake">BRAKE / REV</div>
                    <div id="pedal-accel" class="pedal accel">GAS</div>
                </div>
            </div>

            <div id="gamepad-hint" class="hud-hint">
                <span>🎮 <b>Gamepad Connected!</b> LS: Steer | RT: Gas | LT: Brake | RB/LB: Gear Shift | Y: Camera</span>
            </div>
        </div>
    </div>

    <script src="js/city.js"></script>
    <script src="js/car.js"></script>
    <script src="js/transmission.js"></script>
    <script src="js/traffic.js"></script>
    <script src="js/gamepad.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
